<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="64" height="64" shape-rendering="crispEdges">
  <!-- house 1 (left): walls + roof + chimney -->
  <rect x="1" y="8"  width="5" height="4" fill="#4a3820"/>
  <rect x="1" y="6"  width="5" height="2" fill="#5a2a18"/>
  <rect x="2" y="4"  width="3" height="2" fill="#5a2a18"/>
  <rect x="3" y="3"  width="1" height="2" fill="#5a2a18"/>
  <!-- door + window house 1 -->
  <rect x="3" y="9"  width="1" height="3" fill="#1a1208"/>
  <rect x="2" y="8"  width="1" height="2" fill="#887060"/>
  <!-- house 2 (right): wider, slightly different roof pitch -->
  <rect x="9"  y="7"  width="6" height="5" fill="#3a2e1a"/>
  <rect x="9"  y="5"  width="6" height="2" fill="#4a2010"/>
  <rect x="10" y="4"  width="4" height="1" fill="#4a2010"/>
  <rect x="11" y="3"  width="2" height="1" fill="#4a2010"/>
  <rect x="13" y="2"  width="1" height="2" fill="#3a2010"/>
  <!-- door + window house 2 -->
  <rect x="11" y="8"  width="2" height="4" fill="#1a1208"/>
  <rect x="9"  y="7"  width="2" height="2" fill="#887060"/>
  <!-- chimney smoke hint -->
  <rect x="3"  y="2"  width="1" height="1" fill="#504848"/>
  <rect x="13" y="1"  width="1" height="1" fill="#504848"/>
</svg>

