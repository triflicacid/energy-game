<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="64" height="64" shape-rendering="crispEdges">
  <!-- left tree: small, cols 1-3, rows 6-10 -->
  <rect x="1" y="7" width="3" height="4" fill="#1e4820"/>
  <rect x="2" y="6" width="1" height="1" fill="#1e4820"/>
  <rect x="1" y="7" width="3" height="1" fill="#2a6828"/>
  <!-- left trunk -->
  <rect x="2" y="11" width="1" height="1" fill="#5a3212"/>
  <!-- center tree: tallest, cols 5-10, rows 2-10 -->
  <rect x="5" y="3" width="6" height="8" fill="#1e4820"/>
  <rect x="6" y="2" width="4" height="2" fill="#1e4820"/>
  <rect x="6" y="3" width="4" height="3" fill="#2a6828"/>
  <rect x="7" y="2" width="2" height="2" fill="#3a8838"/>
  <!-- center trunk -->
  <rect x="7" y="11" width="2" height="1" fill="#5a3212"/>
  <!-- right tree: medium, cols 11-14, rows 4-10 -->
  <rect x="11" y="5" width="4" height="6" fill="#1e4820"/>
  <rect x="12" y="4" width="2" height="1" fill="#1e4820"/>
  <rect x="11" y="5" width="4" height="2" fill="#2a6828"/>
  <!-- right trunk -->
  <rect x="12" y="11" width="2" height="1" fill="#5a3212"/>
</svg>


